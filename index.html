                </div>
            `;

            lucide.createIcons();
            attachCoverEditorInteractions();
        }

        function focusNotebookStickyNoteEditor(recipeId, noteIndex) {
            requestAnimationFrame(() => {
                const editor = document.querySelector(`[data-notebook-note-editor="${recipeId}-${noteIndex}"]`);
                if (!(editor instanceof HTMLTextAreaElement)) return;

                editor.focus({ preventScroll: true });
                const textLength = editor.value.length;
                editor.setSelectionRange(textLength, textLength);
            });
        }

        function openNotebookStickyNotesEditor(recipeId) { if(!hasPremiumAccess()) { showPremiumModal("use sticky notes"); return; }
            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe) return;

            const normalizedNotes = normalizeNotebookStickyNotes(recipe.notebookStickyNotes);
            const hadOverflowNotes = Array.isArray(recipe.notebookStickyNotes) && recipe.notebookStickyNotes.length !== normalizedNotes.length;
            recipe.notebookStickyNotes = normalizedNotes;

            let shouldSave = false;
            let createdNote = false;
            if (hadOverflowNotes) {
                shouldSave = true;
            }

            if (!recipe.notebookStickyNotes.length) {
                recipe.notebookStickyNotes = [getDefaultNotebookStickyNote()];
                shouldSave = true;
                createdNote = true;
            }

            if (userSettings.showNotebookStickyNotes === false) {
                userSettings.showNotebookStickyNotes = true;
                shouldSave = true;
            }

            if (shouldSave) {
                saveData();
            }

            openNotebookStickyNoteMenu(recipeId, 0);

            if (createdNote) {
                showToast('Sticky note added. Type directly on the spread.', 'sticky-note');
            }
        }

        function loadData() {
            const savedSettings = localStorage.getItem('recipeArchiveSettings');
            let shouldResaveSettings = false;

            if (savedSettings) {
                const parsedSettings = JSON.parse(savedSettings);
                userSettings = { ...userSettings, ...parsedSettings };
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'themeMode')) {
                delete userSettings.themeMode;
                shouldResaveSettings = true;
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'simpleMode')) {
                delete userSettings.simpleMode;
                shouldResaveSettings = true;
            }

            if (Object.prototype.hasOwnProperty.call(userSettings, 'hasCompletedOnboarding')) {
                delete userSettings.hasCompletedOnboarding;
                shouldResaveSettings = true;
            }

            userSettings.autoPublish = userSettings.autoPublish === true;

            syncBillingStateWithPremiumFlag();
            userSettings.notebookCover = normalizeNotebookCover(userSettings.notebookCover);
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            document.getElementById('body')?.classList.remove('theme-dark');
            applyUserModeClasses();
            document.documentElement.style.colorScheme = 'light';
            indexViewMode = ['cards', 'list', 'book'].includes(userSettings.indexViewMode) ? userSettings.indexViewMode : 'cards';
            if (!hasPremiumAccess() && indexViewMode === 'book') {
                indexViewMode = 'cards';
                userSettings.indexViewMode = 'cards';
                shouldResaveSettings = true;
            }

            if(userSettings.language && userSettings.language !== 'en') {
                changeGlobalLanguage(userSettings.language);
            }

            const savedRecipes = localStorage.getItem('recipeArchiveData');
            if (savedRecipes) {
                recipes = JSON.parse(savedRecipes).map(recipe => ({
                    ...recipe,
                    notebookStickyNotes: normalizeNotebookStickyNotes(recipe.notebookStickyNotes)
                }));
            } else {
                recipes = [{
                    id: 1,
                    title: "Forester's Mushroom Stew",
                    author: "House Recipe",
                    source: "local",
                    category: "Cooking",
                    country: "🇳🇱 Netherlands",
                    profile: defaultPlaceholderProfile,
                    prepTime: 15,
                    cookTime: 40,
                    servings: 4,
                    difficulty: "Easy",
                    diet: [],
                    cuisine: "European",
                    ingredients: ["500g Mushrooms", "4 Potatoes", "2 cloves of Garlic", "100ml Red Wine", "2 Carrots", "1 Onion"],
                    instructions: [
                        "Chop all vegetables and mushrooms into rough chunks.",
                        "Fry the onions until translucent, then add the mushrooms and garlic.",
                        "Deglaze the pan with red wine.",
                        "Bake at 180°C or let simmer for 40 minutes."
                    ],
                    tips: "Serve with a thick slice of rustic bread! The sauce is amazing when soaked up.",
                    lastOpened: Date.now(),
                    checkedIngredients: [],
                    checkedSteps: [],
                    personalNotes: "",
                    notebookStickyNotes: []
                }];
                saveData();
                shouldResaveSettings = false;
            }

            if (shouldResaveSettings) {
                saveData();
            }
        }

        function saveData() {
            applyUserModeClasses();
            localStorage.setItem('recipeArchiveSettings', JSON.stringify(userSettings));
            localStorage.setItem('recipeArchiveData', JSON.stringify(recipes));
        }

        function normalizeShoppingListLabel(value = '') {
            return String(value || '').replace(/\s+/g, ' ').trim();
        }

        function normalizeShoppingListCollaborator(collaborator, index = 0) {
            const name = normalizeShoppingListLabel(typeof collaborator === 'string' ? collaborator : collaborator?.name);
            if (!name) return null;

            const fallbackSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `partner-${index + 1}`;
            return {
                id: typeof collaborator === 'object' && collaborator?.id ? collaborator.id : `shopping-collab-${fallbackSlug}`,
                name
            };
        }

        function normalizeShoppingListItem(item, index = 0) {
            const label = normalizeShoppingListLabel(item?.label || item?.name);
            if (!label) return null;

            const normalizedSourceRecipeIds = Array.from(new Set((item?.sourceRecipeIds || []).map(value => Number(value)).filter(Number.isFinite)));
            const normalizedSourceRecipeTitles = Array.from(new Set((item?.sourceRecipeTitles || []).map(value => normalizeShoppingListLabel(value)).filter(Boolean)));
            const createdAt = item?.createdAt || new Date().toISOString();

            return {
                id: item?.id || `shopping-item-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
                label,
                note: normalizeShoppingListLabel(item?.note),
                checked: Boolean(item?.checked),
                kind: item?.kind === 'custom' ? 'custom' : 'recipe',
                sourceRecipeIds: normalizedSourceRecipeIds,
                sourceRecipeTitles: normalizedSourceRecipeTitles,
                occurrences: Math.max(1, Number(item?.occurrences) || Math.max(1, normalizedSourceRecipeIds.length, normalizedSourceRecipeTitles.length)),
                assignedTo: normalizeShoppingListLabel(item?.assignedTo),
                createdAt,
                updatedAt: item?.updatedAt || createdAt
            };
        }

        function normalizeShoppingListState(list = {}) {
            const now = new Date();
            return {
                ...getDefaultShoppingList(),
                ...(list || {}),
                items: (list?.items || []).map((item, index) => normalizeShoppingListItem(item, index)).filter(item => {
                    if (item && item.checked && item.updatedAt) {
                        const updatedTime = new Date(item.updatedAt);
                        const diffHours = (now - updatedTime) / (1000 * 60 * 60);
                        if (diffHours >= 24) return false;
                    }
                    return Boolean(item);
                }),
                collaborators: (list?.collaborators || []).map((item, index) => normalizeShoppingListCollaborator(item, index)).filter(Boolean)
            };
        }

        function persistShoppingListState({ rerender = true } = {}) {
            userSettings.shoppingList = normalizeShoppingListState({
                ...userSettings.shoppingList,
                lastUpdatedAt: new Date().toISOString()
            });
            saveData();
            if (rerender && currentView === 'shopping') {
                renderShoppingList();
            }
        }

        function getShoppingListItemByLabel(label) {
            const normalizedLabel = normalizeShoppingListLabel(label).toLowerCase();
            return userSettings.shoppingList.items.find(item => item.label.toLowerCase() === normalizedLabel) || null;
        }

        function toggleRecipeIngredientsInShoppingList(recipeId, openView = false) {
            const recipe = recipes.find(entry => entry.id === recipeId);
            if (!recipe) return;

            const recipeIngredients = (recipe.ingredients || [])
                .map(ingredient => normalizeShoppingListLabel(applyMeasurementSystem(ingredient)))
                .filter(Boolean);

            if (recipeIngredients.length === 0) {
                showToast('No ingredients available.', 'alert-circle');
                return;
            }

            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            
            const hasIngredients = userSettings.shoppingList.items.some(item => 
                !item.checked && (item.sourceRecipeIds || []).includes(recipe.id)
            );

            if (hasIngredients) {
                let removedCount = 0;
                userSettings.shoppingList.items = userSettings.shoppingList.items.filter(item => {
                    if ((item.sourceRecipeIds || []).includes(recipe.id)) {
                        if (item.sourceRecipeIds.length <= 1) {
                            removedCount++;
                            return false;
                        }
                        item.sourceRecipeIds = item.sourceRecipeIds.filter(id => id !== recipe.id);
                        item.sourceRecipeTitles = item.sourceRecipeTitles.filter(title => title !== recipe.title);
                        item.occurrences = Math.max(1, item.sourceRecipeTitles.length);
                        item.updatedAt = new Date().toISOString();
                    }
                    return true;
                });
                persistShoppingListState({ rerender: false });
                showToast(`Removed from shopping list.`, 'shopping-basket');
            } else {
                let addedCount = 0;
                let reopenedCount = 0;
                recipeIngredients.forEach(label => {
                    const existingItem = getShoppingListItemByLabel(label);
                    if (existingItem) {
                        if (existingItem.checked) {
                            existingItem.checked = false;
                            reopenedCount += 1;
                        }
                        existingItem.sourceRecipeIds = Array.from(new Set([...(existingItem.sourceRecipeIds || []), recipe.id]));
                        existingItem.sourceRecipeTitles = Array.from(new Set([...(existingItem.sourceRecipeTitles || []), recipe.title]));
                        existingItem.occurrences = Math.max(1, existingItem.sourceRecipeTitles.length || existingItem.occurrences || 1);
                        existingItem.updatedAt = new Date().toISOString();
                        return;
                    }

                    userSettings.shoppingList.items.push(normalizeShoppingListItem({
                        label,
                        kind: 'recipe',
                        checked: false,
                        sourceRecipeIds: [recipe.id],
                        sourceRecipeTitles: [recipe.title],
                        occurrences: 1,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }, userSettings.shoppingList.items.length));
                    addedCount += 1;
                });
                
                persistShoppingListState({ rerender: false });
                showToast(`Added to shopping list.`, 'shopping-basket');
                
                if (openView) {
                    renderShoppingList();
                    return;
                }
            }
        }

        function addCustomShoppingListItem() {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);

            const nameInput = document.getElementById('shopping-list-custom-name');
            const noteInput = document.getElementById('shopping-list-custom-note');
            if (!(nameInput instanceof HTMLInputElement) || !(noteInput instanceof HTMLInputElement)) return;

            const label = normalizeShoppingListLabel(nameInput.value);
            const note = normalizeShoppingListLabel(noteInput.value);
            if (!label) {
                showToast('Enter an ingredient or item first.', 'alert-circle');
                nameInput.focus();
                return;
            }

            const existingItem = getShoppingListItemByLabel(label);
            if (existingItem) {
                existingItem.checked = false;
                existingItem.note = note || existingItem.note;
                existingItem.updatedAt = new Date().toISOString();
                persistShoppingListState({ rerender: true });
                nameInput.value = '';
                noteInput.value = '';
                nameInput.focus();
                showToast('Existing shopping item reopened.', 'rotate-ccw');
                return;
            }

            userSettings.shoppingList.items.unshift(normalizeShoppingListItem({
                label,
                note,
                kind: 'custom',
                checked: false,
                sourceRecipeIds: [],
                sourceRecipeTitles: [],
                occurrences: 1,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            }, userSettings.shoppingList.items.length));

            persistShoppingListState({ rerender: true });
            nameInput.value = '';
            noteInput.value = '';
            nameInput.focus();
            showToast('Custom item added to your shopping list.', 'plus');
        }

        function toggleShoppingListItemChecked(itemId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const item = userSettings.shoppingList.items.find(entry => entry.id === itemId);
            if (!item) return;

            item.checked = !item.checked;
            item.updatedAt = new Date().toISOString();
            persistShoppingListState({ rerender: true });
        }

        function removeShoppingListItem(itemId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const nextItems = userSettings.shoppingList.items.filter(entry => entry.id !== itemId);
            if (nextItems.length === userSettings.shoppingList.items.length) return;

            userSettings.shoppingList.items = nextItems;
            persistShoppingListState({ rerender: true });
            showToast('Shopping item removed.', 'trash-2');
        }

        function clearCheckedShoppingListItems() {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const checkedCount = userSettings.shoppingList.items.filter(item => item.checked).length;
            if (checkedCount === 0) {
                showToast('No checked items to clear.', 'info');
                return;
            }

            userSettings.shoppingList.items = userSettings.shoppingList.items.filter(item => !item.checked);
            persistShoppingListState({ rerender: true });
            showToast(`${checkedCount} checked item${checkedCount === 1 ? '' : 's'} cleared.`, 'rotate-ccw');
        }

        function submitShoppingListCollaborator(inputId, modalId) {
            const input = document.getElementById(inputId);
            if (!(input instanceof HTMLInputElement)) return;

            const name = normalizeShoppingListLabel(input.value);
            if (!name) {
                showToast('Enter a partner name first.', 'alert-circle');
                input.focus();
                return;
            }

            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const exists = userSettings.shoppingList.collaborators.some(collaborator => collaborator.name.toLowerCase() === name.toLowerCase());
            if (exists) {
                showToast('That partner is already on this list.', 'info');
                input.focus();
                input.select();
                return;
            }

            userSettings.shoppingList.collaborators.push(normalizeShoppingListCollaborator({ name }, userSettings.shoppingList.collaborators.length));
            persistShoppingListState({ rerender: true });
            closeModal(modalId);
            showToast('Shopping partner added.', 'users');
        }

        function showShoppingListCollaboratorModal() {
            const activeFamilies = (userFamilies || []).filter(f => !f.removedMembers || !f.removedMembers.some(m => m.userId === currentUser?.uid));
            if (activeFamilies.length === 0) {
                const modalId = createModal('Family Required', `
                    <div class="space-y-4 text-inkDark">
                        <div class="rounded-2xl border border-parchmentDark bg-parchment p-4 shadow-sm">
                            <p class="text-[11px] font-bold uppercase tracking-[0.24em] text-sage">No active family</p>
                            <p class="mt-2 text-sm font-semibold leading-relaxed text-forest">Partners can only be selected from an existing family. Please create or join a family book in your Profile first.</p>
                        </div>
                    </div>
                `, [
                    { text: 'Close', onClick: () => closeModal(modalId) },
                    { text: 'Go to Profile', primary: true, onClick: () => { closeModal(modalId); renderProfile(); } }
                ]);
                return;
            }

            const inputId = `shopping-collaborator-input-${Date.now()}`;
            let modalId = null;

            modalId = createModal('Select Family Partner', `
                <div class="space-y-4 text-inkDark">
                    <div class="rounded-2xl border border-parchmentDark bg-parchment p-4 shadow-sm">
                        <p class="text-[11px] font-bold uppercase tracking-[0.24em] text-sage">Family Roster</p>
                        <p class="mt-2 text-sm font-semibold leading-relaxed text-forest">Select a partner from your active family books to share this list with.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-[0.22em] text-sage mb-2" for="${inputId}">Partner name</label>
                        <input id="${inputId}" type="text" class="${inputClass}" placeholder="Name of family member..." />
                    </div>
                </div>
            `, [
                { text: 'Cancel', onClick: () => closeModal(modalId) },
                { text: 'Add Partner', primary: true, onClick: () => submitShoppingListCollaborator(inputId, modalId) }
            ]);

            requestAnimationFrame(() => {
                const input = document.getElementById(inputId);
                if (input instanceof HTMLInputElement) {
                    input.focus();
                    input.select();
                }
            });
        }

        function removeShoppingListCollaborator(collaboratorId) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const collaborator = userSettings.shoppingList.collaborators.find(entry => entry.id === collaboratorId);
            if (!collaborator) return;

            userSettings.shoppingList.collaborators = userSettings.shoppingList.collaborators.filter(entry => entry.id !== collaboratorId);
            userSettings.shoppingList.items = userSettings.shoppingList.items.map(item => (
                item.assignedTo === collaborator.name
                    ? { ...item, assignedTo: '', updatedAt: new Date().toISOString() }
                    : item
            ));
            persistShoppingListState({ rerender: true });
            showToast('Partner removed from the shopping list.', 'user-minus');
        }

        function assignShoppingListItem(itemId, assignedTo) {
            userSettings.shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const item = userSettings.shoppingList.items.find(entry => entry.id === itemId);
            if (!item) return;

            item.assignedTo = normalizeShoppingListLabel(assignedTo);
            item.updatedAt = new Date().toISOString();
            persistShoppingListState({ rerender: true });
        }

        function shareShoppingListSnapshot() {
            const shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const pendingItems = shoppingList.items.filter(item => !item.checked);
            const completedCount = shoppingList.items.filter(item => item.checked).length;
            const pendingLines = pendingItems.length > 0
                ? pendingItems.map(item => `- ${item.label}${item.assignedTo ? ` (${item.assignedTo})` : ''}`).join('\n')
                : '- Everything is checked off.';
            const shareText = `Uculi shopping list\n\nPending items:\n${pendingLines}\n\nCompleted: ${completedCount}`;

            if (navigator.share) {
                navigator.share({
                    title: 'Uculi shopping list',
                    text: shareText
                }).catch(() => copyToClipboard(shareText));
                return;
            }

            copyToClipboard(shareText);
        }

        function renderShoppingListItem(item) {
            const shoppingList = normalizeShoppingListState(userSettings.shoppingList);
            const itemMetaBadges = [
                `<span class="inline-flex items-center rounded-full border border-parchmentDark bg-white px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-sage shadow-sm">${item.kind === 'custom' ? 'Custom' : 'Recipe'}</span>`,
                ...(item.sourceRecipeTitles || []).slice(0, 2).map(title => `<span class="inline-flex items-center rounded-full border border-gold border-opacity-30 bg-gold bg-opacity-10 px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-forest">${escapeHTML(title)}</span>`),
                ((item.sourceRecipeTitles || []).length > 2) ? `<span class="inline-flex items-center rounded-full border border-parchmentDark bg-parchment px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.16em] text-sage">+${item.sourceRecipeTitles.length - 2} more</span>` : ''
            ].join('');

            const assignees = [
                { value: 'You', label: 'U' },
                ...shoppingList.collaborators.map(c => ({ value: c.name, label: c.name.charAt(0).toUpperCase() }))
            ].slice(0, 2);

            const assigneesHtml = assignees.map(a => `
                <button type="button" onclick="assignShoppingListItem('${item.id}', '${item.assignedTo === a.value ? '' : escapeHTML(a.value)}')" 
                    class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold transition-all ${item.assignedTo === a.value ? 'bg-forest text-white shadow-sm ring-2 ring-forest/20' : 'bg-parchment text-sage border border-parchmentDark hover:border-gold hover:text-forest'}" 
                    title="Assign to ${escapeHTML(a.value)}">
                    ${escapeHTML(a.label)}
                </button>
            `).join('');

            return `
                <article class="rounded-xl border border-parchmentDark bg-white p-3 shadow-sm transition-all ${item.checked ? 'opacity-70' : ''}">
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="toggleShoppingListItemChecked('${item.id}')" class="${getAppButtonClasses(item.checked ? 'accent' : 'secondary', { iconOnly: true, size: 'sm' })} flex-shrink-0" title="${item.checked ? 'Reopen item' : 'Mark item done'}" aria-label="${item.checked ? 'Reopen item' : 'Mark item done'}">
                            <i data-lucide="${item.checked ? 'check-check' : 'circle'}" class="h-4 w-4"></i>
                        </button>

                        <div class="min-w-0 flex-1 flex flex-col justify-center">
                            <p class="text-sm font-bold text-forest truncate ${item.checked ? 'line-through' : ''}">${escapeHTML(item.label)}</p>
                            ${(itemMetaBadges || item.note) ? `
                                <div class="mt-1 flex flex-wrap items-center gap-2">
                                    ${itemMetaBadges}
                                    ${item.note ? `<span class="text-[10px] font-semibold text-sage truncate max-w-[120px]">- ${escapeHTML(item.note)}</span>` : ''}
                                </div>
                            ` : ''}
                        </div>

                        <div class="flex items-center gap-2 pl-2 border-l border-parchmentDark">
                            ${assignees.length > 0 ? `<div class="flex -space-x-1 mr-1">${assigneesHtml}</div>` : ''}

        function loadLaunchDiagnostics() {

                launchDiagnostics = {
                    analytics: { ...defaultLaunchAnalytics, ...(parsedDiagnostics.analytics || {}) },
                    errors: Array.isArray(parsedDiagnostics.errors) ? parsedDiagnostics.errors.slice(0, 12) : []
                };
            } catch (error) {
                launchDiagnostics = {
                    analytics: { ...defaultLaunchAnalytics },
                    errors: []
                };

        function trackLaunchEvent(eventKey) {
            if (!Object.prototype.hasOwnProperty.call(defaultLaunchAnalytics, eventKey)) return;
            launchDiagnostics.analytics[eventKey] = (launchDiagnostics.analytics[eventKey] || 0) + 1;
            saveLaunchDiagnostics();

        function recordLaunchError(source, errorLike, stack = '') {
            const message = typeof errorLike === 'string'
                ? errorLike
                : errorLike?.message || String(errorLike || 'Unknown error');
            const errorEntry = {
                id: `launch-error-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                at: new Date().toISOString(),
                source,
                view: currentView,
                message: String(message).slice(0, 280),
                stack: String(stack || errorLike?.stack || '').slice(0, 800)
            };

            launchDiagnostics.errors = [errorEntry, ...launchDiagnostics.errors].slice(0, 12);

        async function syncToFirestore() {

        function getRecipeInstructionText(step) {
            return typeof step === 'string' ? step : step?.text || '';
        }

        function getRecipeInstructionImage(step) {
            return typeof step === 'string' ? '' : step?.image || '';
        }

        function normalizeRecipeInstructionStep(step) {
            const text = getRecipeInstructionText(step).trim();
            if (!text) return null;

            return {
                text,
                image: getRecipeInstructionImage(step)
            };
        }

        function normalizeRecipeInstructions(steps) {
            return (steps || []).map(normalizeRecipeInstructionStep).filter(Boolean);
        }

        function cloneRecipeInstructionStep(step) {
            const normalizedStep = normalizeRecipeInstructionStep(step);
            return normalizedStep ? { ...normalizedStep } : null;
        }

        function getPublishedVersionCode(recipe) {
            if (!recipe) return initialPublishedVersionCode;

            const numericCode = Number(recipe.publishedVersionCode);
            if (Number.isFinite(numericCode) && numericCode >= initialPublishedVersionCode) {
                return Math.round(numericCode);
            }

            const numericVersion = Number.parseFloat(recipe.publishedVersion);
            if (Number.isFinite(numericVersion) && numericVersion >= 1) {
                return Math.round(numericVersion * 100);
            }

            return initialPublishedVersionCode;
        }

        function formatPublishedVersion(versionCode) {
            return (versionCode / 100).toFixed(2);
        }

        function getPublishedVersionLabel(recipe) {
            if (!recipe?.publishedId && recipe?.publishedVersionCode == null && recipe?.publishedVersion == null) return '';
            return `v${formatPublishedVersion(getPublishedVersionCode(recipe))}`;
        }

        function buildPublishedContentSignature(recipe) {
            const normalizedDiet = [...new Set((recipe.diet || []).filter(Boolean))].sort((left, right) => left.localeCompare(right));
            const normalizedInstructions = normalizeRecipeInstructions(recipe.instructions);

            return JSON.stringify({
                title: recipe.title || '',
                author: recipe.author || '',
                category: recipe.category || '',
                country: recipe.country || '',
                profile: recipe.profile || '',
                prepTime: Number(recipe.prepTime) || 0,
                cookTime: Number(recipe.cookTime) || 0,
                servings: Number(recipe.servings) || 0,
                difficulty: recipe.difficulty || '',
                diet: normalizedDiet,
                cuisine: recipe.cuisine || '',
                ingredients: [...(recipe.ingredients || [])],
                instructions: normalizedInstructions,
                tips: recipe.tips || ''
            });
        }

        function hasRecipeChangesSincePublish(recipe) {
            if (!recipe?.publishedId) return false;
            return buildPublishedContentSignature(recipe) !== (recipe.publishedContentSignature || '');
        }

        function isRecipePublishedLive(recipe) {
            return Boolean(recipe?.publishedId) && recipe.publicationState !== 'retracted';
        }

        function getPublishActionLabel(recipe) {
            if (!recipe?.publishedId) return 'Publish';
            if (isRecipePublishedLive(recipe)) return hasRecipeChangesSincePublish(recipe) ? 'Update publish' : 'Published live';
            return hasRecipeChangesSincePublish(recipe) ? 'Republish update' : 'Republish';
        }

        function getLocalRecipeByPublishedId(publishedRecipeId) {
            return recipes.find(recipe => recipe.source !== 'published' && recipe.publishedId === publishedRecipeId) || null;
        }

        function getPublishedRecipeFromCache(publishedRecipeId) {
            return publishedRecipesCache.find(recipe => recipe.id === publishedRecipeId) || null;
        }

        function isSavedPublishedRecipeOutdated(recipe) {
            if (!recipe || recipe.source !== 'published' || !recipe.publishedId) return false;

            const latestPublishedRecipe = getPublishedRecipeFromCache(recipe.publishedId);
            if (!latestPublishedRecipe || latestPublishedRecipe.publicationState === 'retracted') return false;

            return getPublishedVersionCode(latestPublishedRecipe) > getPublishedVersionCode(recipe);
        }

        function upsertPublishedRecipeCacheEntry(publishedRecipe) {
            if (!publishedRecipe?.id) return;

            const existingIndex = publishedRecipesCache.findIndex(recipe => recipe.id === publishedRecipe.id);
            if (existingIndex === -1) {
                publishedRecipesCache.push(publishedRecipe);
                return;
            }

            publishedRecipesCache[existingIndex] = publishedRecipe;
        }

        function buildPublishedRecipePayload(recipe, signature, versionCode) {
            return {
                title: recipe.title || '',
                author: recipe.author || 'Unknown',
                source: 'published',
                category: recipe.category || '',
                country: recipe.country || '',
                profile: recipe.profile || defaultPlaceholderProfile,
                prepTime: Number(recipe.prepTime) || 0,
                cookTime: Number(recipe.cookTime) || 0,
                servings: Number(recipe.servings) || 4,
                difficulty: recipe.difficulty || '',
                diet: [...(recipe.diet || [])],
                cuisine: recipe.cuisine || '',
                ingredients: [...(recipe.ingredients || [])],
                instructions: normalizeRecipeInstructions(recipe.instructions),
                tips: recipe.tips || '',
                authorEmail: currentUser?.email || userSettings.email || '',
                authorName: currentUser?.displayName || recipe.author || userSettings.name || 'Chef',
                authorId: currentUser?.uid || '',
                updatedAt: new Date(),
                likes: Array.isArray(recipe.likes) ? [...recipe.likes] : [],
                publicationState: 'live',
                publishedVersionCode: versionCode,
                publishedVersion: formatPublishedVersion(versionCode),
                publishedContentSignature: signature
            };
        }

        async function publishRecipe(recipeId) { if(!hasPremiumAccess()) { showPremiumModal("publish recipes"); return; }
            if (!isAuthenticated || !firebaseInitialized || !currentUser) {
                showToast('Sign in to publish recipes', 'alert-circle');
                return false;
            }

            try {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return false;
                if (recipe.source === 'published' && !isPublishedRecipeOwnedByCurrentUser(recipe)) {
                    showToast('Only the original author can republish this community recipe.', 'alert-circle');
                    return false;
                }

                const db = firebase.firestore();
                let existingPublishedRecipe = null;
                let docRef = recipe.publishedId
                    ? db.collection('published-recipes').doc(recipe.publishedId)
                    : db.collection('published-recipes').doc();

                if (recipe.publishedId) {
                    const docSnapshot = await docRef.get();
                    if (docSnapshot.exists) {
                        existingPublishedRecipe = { ...docSnapshot.data(), id: docSnapshot.id };
                        if (!isPublishedRecipeOwnedByCurrentUser(existingPublishedRecipe)) {
                            showToast('Only the original author can update this published recipe.', 'alert-circle');
                            return false;
                        }
                    }
                }

                const signature = buildPublishedContentSignature(recipe);
                const previousSignature = existingPublishedRecipe?.publishedContentSignature || recipe.publishedContentSignature || signature;
                const isFirstPublish = !recipe.publishedId;
                const wasRetracted = !isFirstPublish && !isRecipePublishedLive(existingPublishedRecipe || recipe);
                const hasContentChanges = signature !== previousSignature;
                let versionCode = isFirstPublish ? initialPublishedVersionCode : getPublishedVersionCode(existingPublishedRecipe || recipe);

                if (!isFirstPublish && hasContentChanges) {
                    versionCode += 1;
                }

                const publishedAt = existingPublishedRecipe?.publishedAt || recipe.publishedAt || new Date();
                const payload = buildPublishedRecipePayload(recipe, signature, versionCode);

                await docRef.set({
                    ...payload,
                    publishedAt,
                    retractedAt: null
                }, { merge: true });

                recipe.publishedId = docRef.id;
                recipe.publishedAt = publishedAt;
                recipe.publishedVersionCode = versionCode;
                recipe.publishedVersion = formatPublishedVersion(versionCode);
                recipe.publishedContentSignature = signature;
                recipe.publicationState = 'live';
                saveData();

                upsertPublishedRecipeCacheEntry({
                    ...payload,
                    id: docRef.id,
                    publishedAt,
                    retractedAt: null
                });

                const versionLabel = `v${formatPublishedVersion(versionCode)}`;
                if (isFirstPublish) {
                    showToast(`Recipe published to Browse as ${versionLabel}`, 'check-circle');
                } else if (wasRetracted) {
                    showToast(`Recipe is back in Browse as ${versionLabel}`, 'check-circle');
                } else if (hasContentChanges) {
                    showToast(`Published update live as ${versionLabel}`, 'check-circle');
                } else {
                    showToast(`Recipe is already live as ${versionLabel}`, 'check-circle');
                }

                return true;
            } catch (error) {
                showToast(`Publish error: ${error.message}`, 'alert-circle');
                return false;
            }
        }

        async function unpublishRecipe(recipeId) {
            if (!isAuthenticated || !firebaseInitialized || !currentUser) {
                showToast('Sign in to retract published recipes', 'alert-circle');
                return false;
            }

            try {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe?.publishedId) {
                    showToast('This recipe only exists locally right now, so there is nothing to remove from Browse.', 'info');
                    return false;
                }

                const db = firebase.firestore();
                const docRef = db.collection('published-recipes').doc(recipe.publishedId);
                const docSnapshot = await docRef.get();
                const existingPublishedRecipe = docSnapshot.exists ? { ...docSnapshot.data(), id: docSnapshot.id } : null;

                if (existingPublishedRecipe && !isPublishedRecipeOwnedByCurrentUser(existingPublishedRecipe)) {
                    showToast('Only the original author can retract this recipe.', 'alert-circle');
                    return false;
                }

                const updatedAt = new Date();
                await docRef.set({
                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt
                }, { merge: true });

                recipe.publicationState = 'retracted';
                saveData();

                upsertPublishedRecipeCacheEntry({
                    ...(existingPublishedRecipe || {}),
                    id: recipe.publishedId,
                    publicationState: 'retracted',
                    retractedAt: updatedAt,
                    updatedAt
                });

                showToast('Recipe removed from Browse. Saved copies stay with other cooks.', 'cloud-off');
                return true;
            } catch (error) {
                showToast(`Unpublish error: ${error.message}`, 'alert-circle');
                return false;
            }
        }

        async function loadPublishedRecipes() {
            if (!firebaseInitialized) return [];

            try {
                const db = firebase.firestore();
                const snapshot = await db.collection('published-recipes').orderBy('publishedAt', 'desc').limit(50).get();
                publishedRecipesCache = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                hasLoadedPublishedRecipesCache = true;
                return publishedRecipesCache.filter(recipe => recipe.publicationState !== 'retracted');
            } catch (error) {
                console.error('Error loading published recipes:', error);
                return [];
            }
        }

        async function refreshPublishedRecipeById(publishedRecipeId) {
            if (!firebaseInitialized || !publishedRecipeId) return null;

            try {
                const db = firebase.firestore();
                const docSnapshot = await db.collection('published-recipes').doc(publishedRecipeId).get();
                if (!docSnapshot.exists) return null;

                const publishedRecipe = { ...docSnapshot.data(), id: docSnapshot.id };
                upsertPublishedRecipeCacheEntry(publishedRecipe);
                return publishedRecipe;
            } catch (error) {
                console.error('Error refreshing published recipe:', error);
                return null;
            }
        }

        function ensurePublishedRecipesCacheLoaded() {
            if (!firebaseInitialized || hasLoadedPublishedRecipesCache || isLoadingPublishedRecipesCache) return;
            if (!recipes.some(recipe => recipe.source === 'published' && recipe.publishedId)) return;

            isLoadingPublishedRecipesCache = true;
            loadPublishedRecipes()
                .catch(() => [])
                .finally(() => {
                    isLoadingPublishedRecipesCache = false;
                    if (currentView === 'index') renderList();
                });
        }

        function queuePublishedRecipeStatusRefresh(localRecipeId, publishedRecipeId) {
            if (!firebaseInitialized || !publishedRecipeId) return;

            const now = Date.now();
            const lastCheckedAt = publishedRecipeStatusChecks[publishedRecipeId] || 0;
            if (now - lastCheckedAt < 120000) return;

            publishedRecipeStatusChecks[publishedRecipeId] = now;
            refreshPublishedRecipeById(publishedRecipeId).then(() => {
                if (currentView === 'index' && recipes.some(recipe => recipe.id === localRecipeId)) {
                    renderDetail(localRecipeId);
                }
            });
        }

        function isPublishedRecipeOwnedByCurrentUser(recipe) {
            if (!recipe) return false;
            if (currentUser?.uid && recipe.authorId) return recipe.authorId === currentUser.uid;
            if (userSettings.email && recipe.authorEmail) return recipe.authorEmail === userSettings.email;
            return false;
        }

        function isRecipeOwnedByCurrentUser(recipe) {
            if (!recipe) return false;
            if (recipe.source === 'published') return isPublishedRecipeOwnedByCurrentUser(recipe);
            return true;
        }

        function isRecipeEditable(recipe) {
            return Boolean(recipe && recipe.source === 'local');
        }

        function isRecipeAlwaysFavorite(recipe) {
            return Boolean(recipe && recipe.source === 'local');
        }

        function isRecipeFavorited(recipe) {
            if (!recipe) return false;
            return isRecipeAlwaysFavorite(recipe) || Boolean(userSettings.favorites?.includes(recipe.id));
        }

        function canRateRecipe(recipe) {
            return Boolean(recipe) && !isRecipeOwnedByCurrentUser(recipe);
        }

        function getAppButtonClasses(variant = 'secondary', options = {}) {

        function isPublishedRecipeSaved(publishedRecipeId) {
            return recipes.some(recipe => recipe.source === 'published' && recipe.publishedId === publishedRecipeId);
        }

        function toggleSavedPublishedRecipe(publishedRecipeId, returnView = 'browse') {
            const existingIndex = recipes.findIndex(recipe => recipe.source === 'published' && recipe.publishedId === publishedRecipeId);

            if (existingIndex !== -1) {
                const removedRecipe = recipes[existingIndex];
                recipes.splice(existingIndex, 1);
                userSettings.favorites = (userSettings.favorites || []).filter(id => id !== removedRecipe.id);
                saveData();
                showToast('Removed from your Index', 'heart-off');
                if (returnView === 'detail') renderPublishedRecipeDetail(publishedRecipeId);
                else renderBrowse();
                return;
            }

            const publishedRecipe = publishedRecipesCache.find(recipe => recipe.id === publishedRecipeId);
            if (!publishedRecipe) return;

            recipes.unshift({
                ...publishedRecipe,
                id: generateId(),
                source: 'published',
                publishedId: publishedRecipe.id,
                author: publishedRecipe.authorName || publishedRecipe.author || 'Chef',
                profile: publishedRecipe.profile || defaultPlaceholderProfile,
                ingredients: [...(publishedRecipe.ingredients || [])],

                diet: [...(publishedRecipe.diet || [])],

                publishedVersion: formatPublishedVersion(getPublishedVersionCode(publishedRecipe)),
                publishedContentSignature: publishedRecipe.publishedContentSignature || buildPublishedContentSignature(publishedRecipe),
                publicationState: publishedRecipe.publicationState || 'live',

                checkedSteps: [],
                personalNotes: '',
                lastOpened: Date.now()
            });

            saveData();
            showToast('Saved to your Index', 'heart');
            if (returnView === 'detail') renderPublishedRecipeDetail(publishedRecipeId);
            else renderBrowse();

        function exportAllAsJSON() {
            if (requirePremiumFeature('backupDownload')) {
                return;
            }

            const backup = {
                settings: userSettings,
                recipes,
                exportDate: new Date().toISOString()
            };

            const dataStr = JSON.stringify(backup, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `recipe-archive-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showToast('Backup downloaded!', 'download');
        }

        function importFromJSON(e) {
            if (requirePremiumFeature('backupRestore')) {
                e.target.value = '';
                return;
            }

            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const backup = JSON.parse(event.target.result);
                    if (backup.settings && backup.recipes) {
                        userSettings = { ...userSettings, ...backup.settings };
                        recipes = backup.recipes;
                        saveData();
                        showToast('Backup restored successfully!', 'check-circle');
                        renderList();
                        e.target.value = '';
                    } else {
                        showToast('Invalid backup file format', 'alert-circle');
                    }
                } catch (err) {
                    showToast('Error restoring backup', 'x-circle');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        async function exportRecipeAsPDF(recipeId) {
            if (requirePremiumFeature('recipePdfExport')) {
                return;
            }

            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            const normalizePdfText = (value, fallback = '') => {
                const normalized = String(value ?? fallback)
                    .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '')
                    .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
                    .replace(/\u00A0/g, ' ')
                    .normalize('NFKD')

        function generateId() { return recipes.length > 0 ? Math.max(...recipes.map(r => r.id)) + 1 : 1; }

        function toggleCookingMode(recipeId = null) {
            isCookingMode = !isCookingMode;
            document.getElementById('body').classList.toggle('cooking-mode-active');
            const btnText = document.getElementById('focus-btn-text');
            const btnIcon = document.getElementById('focus-btn-icon');
            
            if(isCookingMode) {
                showToast('Cooking mode on. Follow the next unfinished step.', 'chef-hat');
                if(btnText) btnText.textContent = "Exit Cooking";
                if(btnIcon) btnIcon.setAttribute('data-lucide', 'x-circle');

                if (recipeId) {
                    const recipe = recipes.find(r => r.id === recipeId);
                    const nextStepIndex = recipe ? (recipe.instructions || []).findIndex((_, index) => !(recipe.checkedSteps || []).includes(index)) : -1;
                    const targetIndex = nextStepIndex === -1 ? 0 : nextStepIndex;
                    const targetStep = document.querySelector(`.recipe-step-${recipeId}[data-step-index="${targetIndex}"]`);

                    if (targetStep) {
                        targetStep.classList.add('cooking-step-highlight');
                        targetStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        window.setTimeout(() => targetStep.classList.remove('cooking-step-highlight'), 1800);
                    }
                }
            } else {
                showToast('Back to Archive', 'layout-template');
                if(btnText) btnText.textContent = "Start Cooking";
                if(btnIcon) btnIcon.setAttribute('data-lucide', 'chef-hat');
            }
            lucide.createIcons();
        }

        function handleImageUpload(event, targetElementId, targetVarName, isUserSetting = false) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById(targetElementId).style.backgroundImage = `url(${base64})`;
                    document.getElementById(targetElementId).innerHTML = ''; 
                    if(isUserSetting) userSettings[targetVarName] = base64;
                    else window[targetVarName] = base64;
                }
                reader.readAsDataURL(file);
            }
        }

        function check12HourReset(recipe) {
            const now = Date.now();
            if (recipe.lastOpened && (now - recipe.lastOpened > 12 * 60 * 60 * 1000)) {
                recipe.checkedIngredients = [];
                recipe.checkedSteps = [];
            }
            recipe.lastOpened = now;
            saveData();
        }

        function toggleItemCheck(recipeId, type, index, element) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;
            if(!recipe.checkedIngredients) recipe.checkedIngredients = [];
            if(!recipe.checkedSteps) recipe.checkedSteps = [];

            const arr = type === 'ingredient' ? recipe.checkedIngredients : recipe.checkedSteps;
            const pos = arr.indexOf(index);
            if (pos === -1) arr.push(index);
            else arr.splice(pos, 1);

            saveData();
            element.classList.toggle('line-through');
            element.classList.toggle('opacity-40');
            const icon = element.querySelector('.check-icon');
            if (element.classList.contains('line-through')) icon.classList.remove('opacity-0');
            else icon.classList.add('opacity-0');
        }

        function getRecipeDietCoverage(recipe) {
            const coverage = new Set();
            (recipe?.diet || []).filter(Boolean).forEach(tag => {
                const supportedTag = dietOptions.find(option => option.toLowerCase() === String(tag).toLowerCase()) || tag;
                (dietCompatibilityMap[supportedTag] || [supportedTag]).forEach(mappedTag => coverage.add(mappedTag));
            });
            return coverage;
        }

        function doesRecipeMatchDietFilters(recipe) {
            if (dietFilter.length === 0) return true;

            return hasRecipeChangesSincePublish(recipe) || !isRecipePublishedLive(recipe);

            const enteringBookMode = nextMode === 'book' && indexViewMode !== 'book';
            indexViewMode = nextMode;

        function openNotebookCover(skipAnimate = false) {

        function chunkNotebookEntries(items, chunkSize) {
            if (!Array.isArray(items) || items.length === 0) return [];

            const safeChunkSize = Math.max(1, chunkSize || 1);
            const chunks = [];
            for (let index = 0; index < items.length; index += safeChunkSize) {
                chunks.push(items.slice(index, index + safeChunkSize));
            }
            return chunks;
        }

        function isNotebookShortViewport() {
            const viewportHeight = contentDiv?.clientHeight || window.innerHeight || 0;
            return viewportHeight > 0 && viewportHeight < 560;
        }

        function getNotebookRecipeSpreads(recipe) {
            if (!recipe) return [{ left: { kind: 'blank' }, right: { kind: 'blank' } }];

            const isCompactNotebook = window.matchMedia('(max-width: 767px)').matches;
            const isShortNotebook = isNotebookShortViewport();
            const overviewIngredientCount = isShortNotebook ? 2 : (isCompactNotebook ? 4 : 5);
            const extraIngredientPageSize = isShortNotebook ? 3 : (isCompactNotebook ? 5 : 7);
            const firstInstructionPageSize = isShortNotebook ? 2 : (isCompactNotebook ? 3 : 4);
            const extraInstructionPageSize = isShortNotebook ? 3 : (isCompactNotebook ? 4 : 5);
            const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
            const instructions = normalizeRecipeInstructions(recipe.instructions || []);
            const noteBlocks = [];

            if (recipe.tips) {
                noteBlocks.push({
                    title: "Chef's notes",
                    text: applyMeasurementSystem(recipe.tips)
                });
            }

            if (recipe.personalNotes) {
                noteBlocks.push({
                    title: 'Your notes',
                    text: applyMeasurementSystem(recipe.personalNotes)
                });
            }

            const overviewIngredients = ingredients.slice(0, overviewIngredientCount);
            const remainingIngredientChunks = chunkNotebookEntries(ingredients.slice(overviewIngredientCount), extraIngredientPageSize);
            const firstInstructionChunk = instructions.slice(0, firstInstructionPageSize);
            const remainingInstructionChunks = chunkNotebookEntries(instructions.slice(firstInstructionChunk.length), extraInstructionPageSize);
            const noteChunks = chunkNotebookEntries(noteBlocks, isCompactNotebook ? 1 : 2);

            const leftPages = [{
                kind: 'overview',
                ingredients: overviewIngredients,
                remainingIngredients: Math.max(0, ingredients.length - overviewIngredients.length)
            }];

            remainingIngredientChunks.forEach((chunk, index) => {
                leftPages.push({
                    kind: 'ingredients',
                    ingredients: chunk,
                    startIndex: overviewIngredients.length + (index * extraIngredientPageSize)
                });
            });

            const rightPages = [];
            if (instructions.length > 0) {
                rightPages.push({
                    kind: 'instructions',
                    instructions: firstInstructionChunk,
                    startIndex: 0,
                    showMeta: true
                });

                let instructionStartIndex = firstInstructionChunk.length;
                remainingInstructionChunks.forEach(chunk => {
                    rightPages.push({
                        kind: 'instructions',
                        instructions: chunk,
                        startIndex: instructionStartIndex,
                        showMeta: false
                    });
                    instructionStartIndex += chunk.length;
                });
            } else {
                rightPages.push({
                    kind: 'notes',
                    notes: noteChunks.shift() || [],
                    showMeta: true,
                    showDiet: true
                });
            }

            while (noteChunks.length > 0) {
                if (leftPages.length <= rightPages.length) {
                    leftPages.push({ kind: 'notes', notes: noteChunks.shift() });
                } else {
                    rightPages.push({ kind: 'notes', notes: noteChunks.shift() });
                }
            }

            const spreadCount = Math.max(leftPages.length, rightPages.length, 1);
            const spreads = Array.from({ length: spreadCount }, (_, index) => ({
                left: leftPages[index] || { kind: 'blank' },
                right: rightPages[index] || { kind: 'blank' }
            }));

            const lastSpread = spreads[spreads.length - 1];
            if (lastSpread) {
                if (lastSpread.right.kind === 'instructions' || lastSpread.right.kind === 'notes') {
                    lastSpread.right.showDiet = true;
                } else {
                    lastSpread.left.showDiet = true;
                }
            }

            return spreads;
        }

        function syncNotebookViewportHeight() {
            if (!contentDiv || currentView !== 'index' || indexViewMode !== 'book') return;

            const notebookFrame = contentDiv.querySelector('[data-notebook-frame]');
            const notebookSurface = notebookFrame?.querySelector('.notebook-book-spread-surface');
            if (!notebookFrame || !notebookSurface) return;

            if (window.innerWidth >= 768 && !isNotebookShortViewport()) {
                notebookSurface.style.height = '';
                notebookSurface.style.minHeight = '';
                return;
            }

            const contentRect = contentDiv.getBoundingClientRect();
            const frameRect = notebookFrame.getBoundingClientRect();
            const topOffset = Math.max(0, frameRect.top - contentRect.top);
            const reservedGap = window.innerWidth < 768 ? 14 : 18;
            const availableHeight = Math.max(220, Math.floor(contentDiv.clientHeight - topOffset - reservedGap));

            notebookSurface.style.height = `${availableHeight}px`;
            notebookSurface.style.minHeight = `${availableHeight}px`;
        }

        function goToNotebookPage(direction) {
            if (!currentIndexRecipeIds.length) return;

            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                if (direction > 0 && notebookMobileSide === 'left') {
                    notebookMobileSide = 'right';
                    renderList();
                    contentDiv.scrollTop = 0;
                    return;
                }
                if (direction < 0 && notebookMobileSide === 'right') {
                    notebookMobileSide = 'left';
                    renderList();
                    contentDiv.scrollTop = 0;
                    return;
                }
            }

            const currentRecipe = recipes.find(item => item.id === currentIndexRecipeIds[notebookPageIndex]);
            const currentRecipeSpreads = getNotebookRecipeSpreads(currentRecipe);
            const nextSpreadIndex = notebookSpreadPageIndex + direction;

            if (nextSpreadIndex >= 0 && nextSpreadIndex < currentRecipeSpreads.length) {
                activeNotebookStickyNoteMenu = null;
                notebookPageTurnDirection = direction > 0 ? 1 : -1;
                notebookSpreadPageIndex = nextSpreadIndex;
                notebookMobileSide = direction > 0 ? 'left' : 'right';
                renderList();
                contentDiv.scrollTop = 0;
                return;
            }

            const nextIndex = Math.max(0, Math.min(notebookPageIndex + direction, currentIndexRecipeIds.length - 1));
            if (nextIndex === notebookPageIndex) return;

            activeNotebookStickyNoteMenu = null;
            notebookPageTurnDirection = direction > 0 ? 1 : -1;
            notebookPageIndex = nextIndex;
            const nextRecipe = recipes.find(item => item.id === currentIndexRecipeIds[nextIndex]);
            const nextRecipeSpreads = getNotebookRecipeSpreads(nextRecipe);
            notebookSpreadPageIndex = direction > 0 ? 0 : Math.max(0, nextRecipeSpreads.length - 1);
            notebookMobileSide = direction > 0 ? 'left' : 'right';
            renderList();
            contentDiv.scrollTop = 0;
        }

        function isNotebookInteractiveTarget(target) {

        function attachNotebookStickyNoteInteractions(surface) {
            const recipeId = Number(surface?.dataset.recipeId);
            if (!recipeId) return;

            const recipe = recipes.find(item => item.id === recipeId);
            if (!recipe) return;

            recipe.notebookStickyNotes = normalizeNotebookStickyNotes(recipe.notebookStickyNotes);

            surface.querySelectorAll('[data-notebook-note-index]').forEach(noteEl => {
                const noteIndex = Number(noteEl.dataset.notebookNoteIndex);
                const noteCard = noteEl.querySelector('[data-notebook-note-card]');

                noteEl.querySelectorAll('[data-notebook-note-handle]').forEach(handleEl => {
                    handleEl.addEventListener('pointerdown', event => {
                        if (event.pointerType === 'mouse' && event.button !== 0) return;

                        event.preventDefault();
                        event.stopPropagation();

                        if (!recipe.notebookStickyNotes?.[noteIndex] || !noteCard) return;

                        const noteRect = noteEl.getBoundingClientRect();
                        const centerX = noteRect.left + (noteRect.width / 2);
                        const centerY = noteRect.top + (noteRect.height / 2);
                        const startScale = clampNotebookStickyNoteScale(recipe.notebookStickyNotes[noteIndex].scale);
                        const startRotation = clampNotebookStickyNoteRotation(recipe.notebookStickyNotes[noteIndex].rotation);
                        const startDistance = Math.max(1, Math.hypot(event.clientX - centerX, event.clientY - centerY));
                        const startAngle = Math.atan2(event.clientY - centerY, event.clientX - centerX);

                        const moveHandle = moveEvent => {
                            const nextDistance = Math.max(1, Math.hypot(moveEvent.clientX - centerX, moveEvent.clientY - centerY));
                            const nextAngle = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX);
                            let angleDelta = (nextAngle - startAngle) * (180 / Math.PI);

                            if (angleDelta > 180) angleDelta -= 360;
                            if (angleDelta < -180) angleDelta += 360;

                            const nextScale = clampNotebookStickyNoteScale(startScale * (nextDistance / startDistance));
                            const nextRotation = clampNotebookStickyNoteRotation(startRotation + angleDelta);

                            recipe.notebookStickyNotes[noteIndex].scale = nextScale;
                            recipe.notebookStickyNotes[noteIndex].rotation = nextRotation;
                            noteCard.style.transform = `rotate(${nextRotation}deg) scale(${nextScale})`;
                        };

                        const stopHandleDrag = () => {
                            window.removeEventListener('pointermove', moveHandle);
                            window.removeEventListener('pointerup', stopHandleDrag);
                            window.removeEventListener('pointercancel', stopHandleDrag);
                            saveData();
                        };

                        window.addEventListener('pointermove', moveHandle);
                        window.addEventListener('pointerup', stopHandleDrag);
                        window.addEventListener('pointercancel', stopHandleDrag);
                        handleEl.setPointerCapture?.(event.pointerId);
                    });
                });

                noteEl.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    if (event.target.closest('[data-notebook-note-handle]')) return;

                    event.preventDefault();
                    event.stopPropagation();

                    if (!recipe.notebookStickyNotes?.[noteIndex]) return;

                    const rect = surface.getBoundingClientRect();
                    const startX = event.clientX;
                    const startY = event.clientY;
                    let didDrag = false;

                    const moveNote = moveEvent => {
                        if (Math.abs(moveEvent.clientX - startX) > 4 || Math.abs(moveEvent.clientY - startY) > 4) {
                            didDrag = true;
                        }
                        const nextX = clampNotebookStickyNoteX(((moveEvent.clientX - rect.left) / rect.width) * 100);
                        const nextY = clampNotebookStickyNoteY(((moveEvent.clientY - rect.top) / rect.height) * 100);
                        recipe.notebookStickyNotes[noteIndex].x = nextX;
                        recipe.notebookStickyNotes[noteIndex].y = nextY;
                        noteEl.style.left = `${nextX}%`;
                        noteEl.style.top = `${nextY}%`;
                    };

                    const stopDragging = () => {
                        window.removeEventListener('pointermove', moveNote);
                        window.removeEventListener('pointerup', stopDragging);
                        window.removeEventListener('pointercancel', stopDragging);
                        saveData();
                        if (!didDrag) {
                            openNotebookStickyNoteMenu(recipeId, noteIndex);
                        }
                    };

                    window.addEventListener('pointermove', moveNote);
                    window.addEventListener('pointerup', stopDragging);
                    window.addEventListener('pointercancel', stopDragging);
                    noteEl.setPointerCapture?.(event.pointerId);
                });
            });
        }

        function attachNotebookInteractions() {
            const surface = document.getElementById('notebook-swipe-surface');
            const coverSurface = document.getElementById('notebook-cover-surface');

            if (coverSurface) {
                let startX = 0;
                let startY = 0;
                let pointerId = null;
                let isDragging = false;

                const resetCover = () => {
                    coverSurface.style.transition = 'transform 260ms cubic-bezier(0.2, 0.72, 0.18, 1)';
                    coverSurface.style.transform = '';
                    window.setTimeout(() => {
                        coverSurface.style.transition = '';
                    }, 260);
                };

                coverSurface.addEventListener('pointerdown', event => {
                    if (event.pointerType === 'mouse' && event.button !== 0) return;
                    startX = event.clientX;
                    startY = event.clientY;
                    pointerId = event.pointerId;
                    isDragging = true;
                    coverSurface.style.transition = '';
                    coverSurface.setPointerCapture?.(event.pointerId);
                });

                coverSurface.addEventListener('pointermove', event => {
                    if (!isDragging || pointerId !== event.pointerId) return;

                    const deltaX = Math.min(0, event.clientX - startX);
                    const rotateY = Math.max(-160, deltaX * 0.95);
                    const drift = Math.max(-26, deltaX * 0.12);
                    coverSurface.style.transform = `translateX(${drift}px) rotateY(${rotateY}deg)`;
                });

                const finishCoverDrag = event => {
                    if (!isDragging || pointerId !== event.pointerId) return;

                    isDragging = false;
                    const deltaX = event.clientX - startX;
                    const deltaY = event.clientY - startY;
                    if (deltaX < -90 && Math.abs(deltaX) > Math.abs(deltaY)) {
                        coverSurface.style.transition = 'transform 300ms cubic-bezier(0.2, 0.72, 0.18, 1)';
                        coverSurface.style.transform = 'translateX(-18px) rotateY(-162deg)';
                        window.setTimeout(() => openNotebookCover(true), 260);
                        return;
                    }
                    resetCover();
                };

                coverSurface.addEventListener('pointerup', finishCoverDrag);
                coverSurface.addEventListener('pointercancel', finishCoverDrag);
                coverSurface.addEventListener('lostpointercapture', () => {
                    isDragging = false;
                    resetCover();
                });
                return;
            }

            if (!surface) return;

            let startX = 0;
            let startY = 0;
            let pointerId = null;
            let isDragging = false;

            surface.addEventListener('pointerdown', event => {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                if (isNotebookInteractiveTarget(event.target)) return;
                startX = event.clientX;
                startY = event.clientY;
                pointerId = event.pointerId;
                isDragging = true;
                surface.setPointerCapture?.(event.pointerId);
            });

            const finishSwipe = event => {
                if (!isDragging || pointerId !== event.pointerId) return;

                isDragging = false;
                const deltaX = event.clientX - startX;
                const deltaY = event.clientY - startY;

                if (Math.abs(deltaX) > 90 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (deltaX < 0) goToNotebookPage(1);
                    else goToNotebookPage(-1);
                    return;
                }
            };

            surface.addEventListener('pointerup', finishSwipe);
            surface.addEventListener('pointercancel', finishSwipe);
            surface.addEventListener('lostpointercapture', () => {
                isDragging = false;
            });

            attachNotebookStickyNoteInteractions(surface);
        }
